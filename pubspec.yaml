name: nwc_referral
version: 1.0.2+10000022
publish_to: none
description: A new Flutter project.

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^8.0.2
  flutter_screenutil: ^5.9.0
  http: ^1.2.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1
  intl: ^0.18.0
  flutter_launcher_icons: ^0.13.1
  shimmer: ^3.0.0
  flutter_native_splash: ^2.3.10
  drop_down_search_field: ^1.0.3
  font_awesome_flutter: ^10.7.0
  carousel_slider: ^5.1.1
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  dropdown_search: ^6.0.1
  file_picker: ^8.0.7
  syncfusion_flutter_pdfviewer: ^27.2.3
  dio: ^5.7.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.2
  dotted_border: ^2.1.0
  flutter_easyloading: ^3.0.5
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Cabin
      fonts:
        - asset: assets/fonts/Cabin-Bold.ttf
        - asset: assets/fonts/Cabin-BoldItalic.ttf
        - asset: assets/fonts/Cabin-Italic.ttf
        - asset: assets/fonts/Cabin-Medium.ttf
        - asset: assets/fonts/Cabin-MediumItalic.ttf
        - asset: assets/fonts/Cabin-Regular.ttf
        - asset: assets/fonts/Cabin-SemiBold.ttf
        - asset: assets/fonts/Cabin-SemiBoldItalic.ttf
    - family: ProximaNovaFont
      fonts:
        - asset: assets/fonts/proxima_nova_font.otf
        - asset: assets/fonts/ProximaNova-Black.ttf
        - asset: assets/fonts/ProximaNova-Bold.ttf
        - asset: assets/fonts/ProximaNova-Extrabld.ttf
        - asset: assets/fonts/ProximaNova-Light.ttf
        - asset: assets/fonts/ProximaNova-Regular.ttf
        - asset: assets/fonts/ProximaNova-Semibold.ttf
        - asset: assets/fonts/ProximaNovaT-Thin.ttf

  assets:
    - assets/
    - assets/icons/
    - assets/logo/
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo/logo.jpg
  color_dark: "#FFFFFF"
  image_dark: assets/logo/logo.jpg
  android_12:
    image: assets/logo/logo.jpg
    icon_background_color: "#FFFFFF"
    image_dark: assets/logo/logo.jpg
    icon_background_color_dark: "#FFFFFF"
  web: false